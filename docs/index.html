<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Wins">
<meta name="theme-color" content="#EEF7FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Little Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: iOS-style grouped lists on a quiet grey ground. Baby blue for actions and joint habits,
   sunny yellow for highlights (note button, streaks, cheers); partner colours (rose, amber) appear only as small dots and the ticks they own. Notes stay on warm paper. */
:root{
  --paper:#EEF7FD; --surface:#FFFFFF; --surface-2:#E6F2FA; --line:#D9E9F4; --backdrop:#DDEEFA;
  --ink:#111114; --ink-2:#6E6E73; --ink-3:#A1A1A6;
  --joyce:#F2557F; --alex:#F0A800; --us:#1E96DF;
  --sun:#1E96DF; --sun-soft:#FFFFFF; --sun-ink:#FFFFFF;
  --accent:#8FD3FF; --accent-ink:#06324D; --accent-soft:#E3F4FF;
  --yellow:#FFD43B; --yellow-ink:#3D2E00; --yellow-soft:#FFF6D1;
  --note:#FFFBF2; --note-ink:#2B2238; --note-line:#F1E8D6;
  --scrim:rgba(0,0,0,.32);
  --shadow:none; --lift:0 10px 30px rgba(0,0,0,.12);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --backdrop:#000000;
  --ink:#F5F5F7; --ink-2:#AEAEB2; --ink-3:#6E6E73;
  --joyce:#FF6B95; --alex:#FFC43D; --us:#6CC4FF;
  --sun:#6CC4FF; --sun-soft:#1C1C1E; --sun-ink:#04263B;
  --accent:#7CCBFF; --accent-ink:#04263B; --accent-soft:#12324A;
  --yellow:#FFD43B; --yellow-ink:#3D2E00; --yellow-soft:#3A3212;
  --note:#FFF8EA; --note-ink:#2B2238; --note-line:#EADFC8;
  --scrim:rgba(0,0,0,.6);
  --shadow:none; --lift:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --backdrop:#000000;
  --ink:#F5F5F7; --ink-2:#AEAEB2; --ink-3:#6E6E73;
  --joyce:#FF6B95; --alex:#FFC43D; --us:#6CC4FF;
  --sun:#6CC4FF; --sun-soft:#1C1C1E; --sun-ink:#04263B;
  --accent:#7CCBFF; --accent-ink:#04263B; --accent-soft:#12324A;
  --yellow:#FFD43B; --yellow-ink:#3D2E00; --yellow-soft:#3A3212;
  --note:#FFF8EA; --note-ink:#2B2238; --note-line:#EADFC8;
  --scrim:rgba(0,0,0,.6);
  --shadow:none; --lift:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--us);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:600px){body{background:var(--backdrop)}.app{box-shadow:0 0 0 1px var(--line)}}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:10px 28px;display:flex;flex-direction:column;gap:22px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex:none}
.moodcard{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.scale button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;min-height:58px}
.scale button span{font-size:24px;filter:grayscale(1);opacity:.45;transition:.2s}
.scale button small{font-size:11px;font-weight:800;color:var(--ink-3)}
.scale button[aria-checked="true"]{background:var(--surface);box-shadow:var(--shadow)}
.scale button[aria-checked="true"] span{filter:none;opacity:1;transform:scale(1.1)}
.scale button[aria-checked="true"] small{color:var(--ink)}
#moodText{min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:10px 12px;width:100%}
.pmood{display:flex;gap:10px;align-items:flex-start;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.pmood .av{flex:none}
.streaks{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.stc{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:0;border-top:4px solid var(--pc);min-width:0}
.stc b{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--pc)}
.stc span{font-size:12px;font-weight:800;color:var(--ink-2)}
.stc small{font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-img{max-width:70%!important}
.mnote{margin:0;font-size:13px;color:var(--ink-2);padding-left:10px;border-left:3px solid var(--pc)}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top h1{font-size:30px;font-weight:800;line-height:1.1;margin-top:2px}
.pair{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);flex:none}
.pair .av+.av{margin-left:-12px}
.pair small{font-size:11px;font-weight:800;color:var(--ink-2);letter-spacing:.04em}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--pc);border:2px solid var(--surface)}

.days{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.days button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:38px}
.days button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.backfill{font-size:13px;color:var(--ink-2);margin-top:-12px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:19px;font-weight:800}
.sec-h span{font-size:13px;color:var(--ink-3);font-weight:600}

/* Cheer cards */
.cheer{background:var(--sun-soft);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,opacity .3s}
.cheer-top{display:flex;gap:12px;align-items:center}
.cheer-emo{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:19px;flex:none}
.cheer-txt{min-width:0;flex:1}
.cheer-txt b{font-weight:800}
.cheer-txt .sub{font-size:13px;color:var(--ink-2)}
.cheer-row{display:flex;gap:6px;align-items:center}
.stk{width:44px;height:44px;border-radius:50%;background:var(--surface);font-size:20px;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.stk:active{transform:scale(.88)}
.stk.more{font-size:18px;font-weight:800;color:var(--ink-2)}
.cheer.sent{transform:scale(.97);opacity:.0}
.cheer .sentmsg{font-weight:800;text-align:center;padding:8px}
.caught{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);background:var(--surface);border-radius:16px;padding:12px 14px}
.notepeek{font-family:var(--f-hand);font-size:22px;line-height:1.1;color:var(--ink)}
.btn-open{font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;background:var(--surface);margin-left:auto}

/* Mood */
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mood{background:var(--surface);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:var(--shadow);min-height:64px}
.mood .m-emo{font-size:28px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);flex:none}
.mood .m-who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.mood .m-lbl{font-size:15px;font-weight:700}
.mood .m-empty{color:var(--ink-3);font-weight:700}

/* Habits */
.hab{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);min-height:66px}
.hemo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--pc) 14%,var(--surface));flex:none}
.hmeta{flex:1;min-width:0}
.hname{font-weight:800;display:flex;align-items:center;gap:6px}
.hsub{font-size:13px;color:var(--ink-2)}
.hab.is-done .hsub{color:var(--pc);font-weight:700}
.rx{letter-spacing:2px}
.lock{width:14px;height:14px;color:var(--ink-3);flex:none}
.tick{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .15s}
.tick svg{width:22px;height:22px;opacity:0;transform:scale(.6);transition:.2s}
.tick[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.tick[aria-pressed="true"] svg{opacity:1;transform:none}
.tick:active{transform:scale(.9)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.sbtn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);font-size:20px;font-weight:800;display:grid;place-items:center}
.sbtn:disabled{opacity:.35;cursor:default}
.sval{min-width:62px;text-align:center;font-size:13px;color:var(--ink-2);line-height:1.1}
.sval b{display:block;font-size:20px;font-family:var(--f-display);color:var(--pc)}
.us-badge{display:inline-flex;align-items:center}
.us-badge i{width:10px;height:10px;border-radius:50%;background:var(--joyce);display:inline-block}
.us-badge i+i{background:var(--alex);margin-left:-4px;box-shadow:0 0 0 2px var(--paper)}

/* Note CTA */
.note-cta{position:relative;background:var(--note);color:var(--note-ink);border-radius:6px 20px 20px 20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--note-line) 27px 28px)}
.note-cta h3{font-size:18px}
.note-cta p{margin:0;font-size:14px;color:#6C6280}
.note-cta .hand{font-family:var(--f-hand);font-size:24px;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;font-weight:800;background:var(--ink);color:var(--paper)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}

.pulse{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pulse p{margin:0;font-weight:700}
.pulse .opts{display:flex;gap:6px;flex-wrap:wrap}
.pulse .opts button{flex:1 1 30%;min-height:44px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:700;padding:6px}
.pulse small{color:var(--ink-3);font-size:12px}

/* Timeline */
.page{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.page-h{display:flex;align-items:center;gap:10px}
.page-h h3{font-size:20px;font-weight:800}
.page-h .date{font-size:13px;color:var(--ink-3);font-weight:700}
.page-h .pm{margin-left:auto;display:flex;gap:4px}
.pm span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--pc)}
.ev{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.ev .t{flex:1;min-width:0}
.ev .when{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stks{display:flex}
.stks span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--surface);box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.12);margin-left:-6px;transform:rotate(-8deg)}
.stks span:nth-child(2n){transform:rotate(7deg)}
.paper{background:var(--note);color:var(--note-ink);border-radius:4px 16px 16px 16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;transform:rotate(-.6deg);box-shadow:0 2px 10px rgba(43,34,56,.1)}
.paper:nth-of-type(2n){transform:rotate(.6deg)}
.paper .from{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.paper .hand{font-family:var(--f-hand);font-size:24px;line-height:1.15}
.paper img{width:100%;max-width:100%;border-radius:8px}
.paper .foot{display:flex;justify-content:flex-end}
.tl-intro{font-size:14px;color:var(--ink-2);margin:4px 0 0}

/* Habits manager */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;width:100%;min-height:62px}
.chip{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.chip.priv{background:color-mix(in srgb,var(--ink) 10%,var(--surface))}
.chev{color:var(--ink-3);font-size:18px}
.muted{color:var(--ink-3);font-size:13px}

/* Year book */
.book-cover{aspect-ratio:3/4;max-width:100%;width:62%;margin:0 auto;border-radius:6px 14px 14px 6px;background:var(--us);color:#fff;padding:20px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 8px 0 0 rgba(0,0,0,.12),0 18px 40px rgba(60,30,100,.3);position:relative;overflow:hidden}
.book-cover::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--sun);right:-60px;bottom:-60px;opacity:.9}
.book-cover .yr{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;position:relative;z-index:1}
.book-cover .names{font-family:var(--f-hand);font-size:26px;line-height:1;position:relative;z-index:1}
.book-cover small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:42px;padding:0 12px;border-radius:12px;background:var(--surface);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range label{font-size:12px;font-weight:800;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.range input{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;width:100%;min-width:0}
.includes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.includes li{display:flex;gap:8px}
.ready{background:var(--surface);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--sun-soft);border-top-color:var(--sun);animation:spin .8s linear infinite}

/* Tab bar */
nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px 6px;border-top:1px solid var(--line);background:var(--paper)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--ink-3);min-height:50px;justify-content:center}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--ink)}
nav .fab{position:relative;top:-14px}
nav .fab span{width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,170,50,.45),0 0 0 5px var(--paper)}
nav .fab em{font-style:normal;margin-top:4px;color:var(--ink-2)}

/* Sheets, banner, toast */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:30;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:16px;animation:rise .28s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-size:22px;font-weight:800}
.sheet .lede{margin:-8px 0 0;color:var(--ink-2);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input[type=text],.field textarea{min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:10px 12px;width:100%}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{aspect-ratio:1;max-width:100%;border-radius:10px;font-size:20px}
.emojis button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--us)}
.wd{display:flex;gap:4px}
.wd button{flex:1;min-height:40px;border-radius:10px;background:var(--paper);font-weight:800;font-size:13px}
.wd button[aria-pressed="true"]{background:var(--us);color:#fff}
.inline{display:flex;align-items:center;gap:10px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.err{color:var(--joyce);font-size:13px;font-weight:700;margin:0}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);width:100%}
.choice b{font-size:16px}
.choice span{font-size:13px;color:var(--ink-2)}
.moodgrid,.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.moodgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--paper);font-size:12px;font-weight:700}
.moodgrid button span{font-size:30px}
.moodgrid button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--us)}
.stkgrid button{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--paper);font-size:30px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok,#3E9B6B)}
.switch[aria-checked="true"]::after{left:23px}
.names2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names2 input{min-width:0}

/* Note composer */
.pad-wrap{background:var(--note);border-radius:16px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--note-line)}
.pad-wrap canvas{display:block;width:100%;height:220px;touch-action:none}

function habRow(h,d){

    ctrl=`<div class="stepper"><button class="sbtn" data-a="dec" data-h="${h.id}" aria-label="One less" ${n?'':'disabled'}>−</button><span class="sval">${n?`<b>${n}</b>`:''}${esc(h.unit||'times')}</span><button class="sbtn" data-a="inc" data-h="${h.id}" aria-label="One more">+</button></div>`}

function cheerCard(it){

function jokeSection(d){

function vToday(){

  out+=`<section class="sec"><div class="sec-h"><h2>Cheer ${esc(nm(p))}</h2>${cheers.length?`<span>${cheers.length===1?'1 thing':cheers.length+' things'} to cheer</span>`:''}</div>`;

  out+=`</section>`;

    <input type="text" id="moodText" maxlength="80" value="${esc(myMoodText)}" placeholder="Add a few words, e.g. nervous about my exam" aria-label="What's on your mind">
    ${pMood?`<div class="pmood" style="--pc:${pcol(p)}">${av(p)}<span><b>${esc(nm(p))}</b> is feeling ${moodLabel(pMood).toLowerCase()} ${pMood}${pMoodText?`<br><span class="muted">“${esc(pMoodText)}”</span>`:''}</span></div>`:`<div class="pmood muted">${av(p)}<span>${esc(nm(p))} hasn't shared a mood yet today.</span></div>`}
    </div></section>`;

  out+=`<section class="sec"><div class="sec-h"><h2>My goals</h2><button class="muted" data-a="tab" data-tab="habits" style="font-weight:800">Edit</button></div>${mine.length?'<div class="group">'+mine.map(x=>habRow(x,d)).join('')+'</div>':`<div class="caught">Nothing planned for ${isToday?'today':'this day'}. Enjoy the breather.</div>`}</section>`;
  return out;
}
function dayEvents(d,viewer){
  const evs=[];
  S.checkins.filter(c=>c.date===d&&canSee(viewer,c)).forEach(c=>evs.push({at:c.at,kind:'c',c}));
  S.notes.filter(n=>n.date===d).forEach(n=>evs.push({at:n.at,kind:'n',n}));
  (S.jokes||[]).filter(j=>j.date===d).forEach(j=>evs.push({at:j.at,kind:'k',j}));
  return evs.sort((a,b)=>a.at<b.at?1:-1);
}
function stks(t){const r=rxOf(t);return r.length?`<span class="stks" aria-label="Reactions">${r.map(x=>`<span title="${esc(nm(x.by))}">${x.s}</span>`).join('')}</span>`:''}
function pageHTML(d,viewer,opts={}){

  const notes=evs.filter(e=>e.kind==='n').map(e=>`<div class="paper" style="--pc:${pcol(e.n.by)}"><span class="from">From ${esc(who(e.n.by)==='You'?'you':nm(e.n.by))} · ${e.n.at}</span>${e.n.text?`<div class="hand">${esc(e.n.text)}</div>`:''}${e.n.drawing?`<img src="${e.n.drawing}" alt="Drawing from ${esc(nm(e.n.by))}">`:''}${rxOf('n:'+e.n.id).length?`<div class="foot">${stks('n:'+e.n.id)}</div>`:''}</div>`).join('');
  const mn=S.moodNotes[d]||{};const mnl=['j','a'].filter(u=>mn[u]&&m[u]).map(u=>`<p class="mnote" style="--pc:${pcol(u)}"><b>${esc(who(u))}</b> felt ${moodLabel(m[u]).toLowerCase()}: “${esc(mn[u])}”</p>`).join('');

}
function timelineDays(viewer){
  const set=new Set();
  S.checkins.forEach(c=>{if(canSee(viewer,c))set.add(c.date)});
  S.notes.forEach(n=>set.add(n.date));
  (S.jokes||[]).forEach(j=>set.add(j.date));
  Object.keys(S.moods).forEach(d=>{if(Object.keys(S.moods[d]).length)set.add(d)});
  return [...set].sort().reverse();
}

function onbHTML(){

  const err=o.err?`<p class="onb-err" role="alert">${esc(o.err)}</p>`:'';
  if(o.busy)return wrap('Little Wins',`<h1>${esc(o.busy)}</h1><div class="spin" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></div>`,'');
  if(o.st==='welcome')return wrap('Welcome',`<div class="blob"><span></span><span></span></div><h1>A little space for the two of you.</h1><p>Work on habits alone or together, cheer each other on, and keep a year of small wins.</p>`,
    `<button class="btn block" data-a="onbgo" data-v="create">Create our space</button><button class="btn ghost block" data-a="onbgo" data-v="join">I have an invite link</button>`);
  if(o.st==='create')return wrap('Step 1 of 2',`<h1>Who's in this space?</h1><label class="onb-f">Your name<input type="text" id="oMe" maxlength="16" autocomplete="given-name" value="${esc(o.me||'')}"></label><label class="onb-f">Your person's name<input type="text" id="oYou" maxlength="16" value="${esc(o.you||'')}"></label>${err}`,
    `<button class="btn block" data-a="oncreate">Create our space</button><button class="btn ghost block" data-a="onbgo" data-v="welcome">Back</button>`);
  if(o.st==='invite')return wrap('Step 2 of 2',`<h1>Invite ${esc(nm('a'))}</h1><p>Send ${esc(nm('a'))} this link. They add Little Wins to their Home Screen, open it, tap <b>I have an invite link</b> and paste it.</p><div class="link-box">${esc(o.link)}</div><p style="font-size:14px">Keep it between the two of you. Anyone with the link can join your space.</p>`,
    `<button class="btn block" data-a="sharelink">Share invite link</button><button class="btn ghost block" data-a="onbdone">Go to Today</button>`);
  if(o.st==='install')return wrap('Invite',`<h1>Add Little Wins to your Home Screen first</h1><ol class="steps"><li><b class="n">1</b><span>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</span></li><li><b class="n">2</b><span>Open Little Wins from your Home Screen.</span></li><li><b class="n">3</b><span>Tap <b>I have an invite link</b> and paste the link you were sent.</span></li></ol>`,
    `<button class="btn block" data-a="copylink">Copy invite link</button><button class="btn ghost block" data-a="onbgo" data-v="join">Use it here in Safari instead</button>`);
  if(o.st==='join')return wrap('Join',`<h1>Join your person</h1><p>Paste the invite link they sent you.</p><textarea id="oLink" class="onb-link" rows="3" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Invite link">${esc(o.link||'')}</textarea>${err}`,
    `<button class="btn block" data-a="onjoin">Join</button><button class="btn ghost block" data-a="onbgo" data-v="welcome">Back</button>`);
  if(o.st==='who')return wrap('Almost there',`<h1>Which one are you?</h1><p>This phone will post as the person you pick.</p>${err}`,
    ['j','a'].map(u=>`<button class="btn block" data-a="onwho" data-v="${u}">I'm ${esc(nm(u)||'…')}</button>`).join(''));
  return '';
}

let toastT;function toast(m){const t=document.getElementById('toast');t.innerHTML=`<div class="ts">${m}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2200)}
let banT;function banner(icon,title,msg){if(S.muted)return;const b=document.getElementById('banner');b.innerHTML=`<button class="bn" data-a="bannergo"><span class="app-ic">${icon}</span><span><small>Little Wins · now</small><b>${title}</b><br><span class="muted">${msg}</span></span></button>`;clearTimeout(banT);banT=setTimeout(()=>b.innerHTML='',4500)}

/* ---------- drawing pad ---------- */
let padEl,ctx;
function initPad(){
  padEl=document.getElementById('pad');if(!padEl)return;
  const r=padEl.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  padEl.width=r.width*dpr;padEl.height=r.height*dpr;ctx=padEl.getContext('2d');ctx.scale(dpr,dpr);redraw();
  let cur=null;
  const pt=e=>{const b=padEl.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  padEl.onpointerdown=e=>{padEl.setPointerCapture(e.pointerId);cur={c:U.ink,w:SIZES[U.size],p:[pt(e)]};U.strokes.push(cur);const ph=padEl.parentNode.querySelector('.ph');if(ph)ph.remove();redraw()};
  padEl.onpointermove=e=>{if(!cur)return;cur.p.push(pt(e));redraw()};
  padEl.onpointerup=padEl.onpointercancel=()=>{if(cur){cur=null;const u=document.querySelector('[data-a="undo"]');if(u)u.disabled=false}};
}
function redraw(){if(!ctx)return;ctx.clearRect(0,0,padEl.width,padEl.height);ctx.lineCap='round';ctx.lineJoin='round';
  U.strokes.forEach(s=>{ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.beginPath();s.p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke()})}

/* ---------- actions ---------- */
function newCheckin(h,extra){const c=Object.assign({id:'c'+Date.now()+Math.floor(Math.random()*1e3),habitId:h.id,date:U.day,by:S.me,at:nowTime()},U.day!==T()?{backfill:true}:{},extra||{});S.checkins.push(c);return c}
function removeCheckin(c){S.checkins=S.checkins.filter(x=>x!==c);S.reactions=S.reactions.filter(r=>r.target!=='c:'+c.id)}
function checkToast(h){const p=nm(P());toast(h.owner==='both'?'Done for both of you':h.vis==='private'?'Logged. Only you can see this.':`Nice! ${esc(p)} will see this.`)}
function openForm(h){U.formErr='';U.form=h?{id:h.id,name:h.name,emoji:h.emoji,owner:h.owner==='both'?'both':'me',type:h.type,unit:h.unit||'',freq:JSON.parse(JSON.stringify(h.freq)),vis:h.vis}:{name:'',emoji:'🪴',owner:'me',type:'yes',unit:'',freq:{kind:'daily'},vis:'shared'};if(!U.form.freq.n)U.form.freq.n=3;if(!U.form.freq.days)U.form.freq.days=[1,3,5];U.sheet={kind:'habit'};renderSheet()}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast('Copy failed. Press and hold to copy.'))}catch(e){toast('Copy failed')}}

    const h=hab(f.id);const wasPrivate=h.vis==='private';Object.assign(h,{name:f.name,emoji:f.emoji,type:f.type,unit:f.unit,freq:cleanFreq(f.freq)});
    if(h.owner!=='both'&&wasPrivate&&f.vis==='shared'){U.sheet={kind:'reveal',h:h.id};render();return}
    if(h.owner!=='both'&&!wasPrivate&&f.vis==='private'){U.sheet={kind:'hide',h:h.id};render();return}
    U.sheet=null;toast('Saved');render()},
  reveal:el=>{const h=hab(U.sheet.h),v=el.dataset.v;if(v!=='cancel'){h.vis='shared';h.revealFrom=v==='now'?T():null;toast(`${esc(nm(P()))} can now see ${esc(h.name)}`)}U.sheet=null;render()},
  hide:()=>{const h=hab(U.sheet.h);h.vis='private';delete h.revealFrom;U.sheet=null;toast(`${esc(h.name)} is private now`);render()},
  archive:()=>{const h=hab(U.form.id);h.archived=true;U.sheet=null;toast('Archived. Its history stays on your timeline.');render()},
  restore:el=>{hab(el.dataset.h).archived=false;toast('Restored');render()},
  range:el=>{U.book.range=el.dataset.v;U.book.state='idle';render()},
  make:()=>{U.book.state='making';render();setTimeout(()=>{if(U.book.state==='making'){U.book.state='ready';if(U.tab==='book')render()}},1600)},
  makeagain:()=>{U.book.state='idle';render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){if(el.dataset.a!=='scrim')e.stopPropagation();f(el,e)}});
document.addEventListener('input',e=>{
  if(e.target.id==='noteText')U.noteText=e.target.value;
  if(e.target.id==='moodText'){const d=T();S.moodNotes[d]=S.moodNotes[d]||{};S.moodNotes[d][S.me]=e.target.value;save()}
  if(e.target.id==='nJ'||e.target.id==='nA'){const v=e.target.value.trim();if(v){S.names[e.target.id==='nJ'?'j':'a']=v;$main.innerHTML=U.tab==='today'?vToday():U.tab==='timeline'?vTimeline():U.tab==='habits'?vHabits():vBook();$nav.innerHTML=vNav();save()}}
});
document.addEventListener('change',e=>{if(e.target.id==='bFrom'){U.book.from=e.target.value;render()}if(e.target.id==='bTo'){U.book.to=e.target.value;render()}});

/* timelineDays('both-preview') for the book: union of what both partners can see, minus private */
const _td=timelineDays;
timelineDays=function(viewer){if(viewer!=='both-preview')return _td(viewer);const set=new Set();S.checkins.forEach(c=>{if(canSee('j',c)&&canSee('a',c))set.add(c.date)});S.notes.forEach(n=>set.add(n.date));Object.keys(S.moods).forEach(d=>{if(Object.keys(S.moods[d]).length)set.add(d)});return[...set].sort().reverse()};

/* ---------- live updates from the other phone ---------- */
window.LWApp={
  state:()=>S,
  setNames(n){S.names=Object.assign({},S.names,n)},
  // Re-render, unless the person is mid-way through typing or drawing.
  refresh(){const a=document.activeElement;if(U.sheet||(U.onb&&U.onb.st!=='who')||(a&&$main.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))){U.stale=true;save();return}render()},
  joinLink(link){if(!U.onb)return;const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);U.onb={st:ios&&!standalone?'install':'join',link};renderSheet()},
  arrived(items){const me=S.me,p=P();
    items.filter(x=>x.item.by===p).slice(-1).forEach(({col,item})=>{
      if(col==='checkins'){const h=hab(item.habitId);if(h&&canSee(me,item))banner(h.emoji,`${esc(nm(p))} just checked in: ${esc(h.name)}`,'Tap to cheer them on')}
      if(col==='notes')banner('💌',`${esc(nm(p))} sent you a note`,esc((item.text||'A little drawing').slice(0,60)))
      if(col==='jokes')banner('😂',`${esc(nm(p))} sent you a joke`,esc(item.q))
      if(col==='reactions')banner(item.s,`${esc(nm(p))} sent you ${item.s}`,'Your cheer squad of one')
    })}
};
const _close=A.close;A.close=()=>{_close();if(U.stale){U.stale=false;render()}};
render();
})();
</script>
